<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coronel CRM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Coronel CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: identidade Coronel Café — branco, cinzas da marca, dourado só em réguas finas; sidebar branca (desktop), separadores em baixo (telemóvel) */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F2F4; --ink:#1D1D1F; --ink-2:#6E6E73; --ink-3:#6E6E73;
  --line:#E5E5EA; --gold:#C4A052; --hat:#292929;
  --ok:#2E7A4E; --ok-soft:#EAF3ED; --warn:#8A5A12; --warn-soft:#F7F0E3; --bad:#A63D2B; --bad-soft:#F7E9E6; --info:#3B5F7D; --info-soft:#EAF0F5;
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
b,strong,th{font-weight:500}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---------- shell ---------- */
#side{display:none}
#main{min-width:0}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.topin{display:flex;align-items:center;gap:10px;min-height:58px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
#ttl{font-family:var(--f-display);font-weight:400;font-size:28px;letter-spacing:.005em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sm{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.hat{display:block;width:30px;height:auto;flex:none}
.sig{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--ink);font-weight:500}
.rule{display:block;width:28px;height:1px;background:var(--gold);border:0;margin:0}
.me{width:34px;height:34px;border-radius:50%;overflow:hidden;border:1px solid var(--line);flex:none;background:var(--surface-2)}
.me img{width:100%;height:100%;object-fit:cover;display:block}
.ib{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink-2)}
.ib:hover{background:var(--surface-2);color:var(--ink)}
#view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px;max-width:1240px;margin:0 auto}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:500;color:var(--ink-3)}
#tabbar button.on{color:var(--ink)}
#tabbar button.on{box-shadow:inset 0 1px 0 var(--gold)}
#fab{position:fixed;z-index:26;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center}
#fab:hover{background:#000}
@media (min-width:960px){
  .mobhat{display:none!important}
  #app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
  #side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--bg);color:var(--ink);border-right:1px solid var(--line);padding:26px 14px 16px;overflow:auto}
  #tabbar{display:none}
  #fab{bottom:calc(28px + env(safe-area-inset-bottom,0px));right:calc(28px + env(safe-area-inset-right,0px))}
  #view{padding-block:26px 96px}
}
.logo{padding:4px 10px 26px;display:flex;flex-direction:column;gap:12px}
.logo .hat{width:40px}
.nv{display:flex;flex-direction:column;gap:2px}
.nv button{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--ink-2);padding:9px 10px;border-radius:8px;text-align:left;font-size:14px}
.nv button .ic{color:var(--ink-2)}
.nv button:hover{background:var(--surface-2);color:var(--ink)}
.nv button.on{background:var(--surface-2);color:var(--ink);box-shadow:inset 1px 0 0 var(--gold)}
.nv button.on .ic{color:var(--ink)}
.nv .sep{height:1px;background:var(--line);margin:10px 6px}
.nv .cnt{margin-left:auto;font-size:11px;background:var(--ink);color:#fff;border-radius:20px;padding:1px 7px;font-weight:500}
.side-me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 8px 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.side-me b{color:var(--ink);font-weight:500;display:block}

/* ---------- blocks ---------- */
.pg{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.ph h2{font-family:var(--f-display);font-size:24px;font-weight:400;flex:1}
.ph .lnk{border:0;background:none;color:var(--ink-2);font-weight:500;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.pb{padding:0 16px 16px}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.hello h1{font-family:var(--f-display);font-weight:400;font-size:38px;line-height:1.1}
.hello p{margin:4px 0 0;color:var(--ink-2)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
button.kpi:hover{border-color:var(--ink-2)}
.kpi .v{font-size:25px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12.5px;color:var(--ink-3)}
.kpi .s .up{color:var(--ok)} .kpi .s .dn{color:var(--bad)}
.kpi.hl{border-top:1px solid var(--gold)}
.grid2{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){.grid2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}

.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;min-width:0}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink);letter-spacing:.06em}
.av.k{background:var(--bg);border:1px solid var(--line);color:var(--ink-2)}
.rt{display:flex;flex-direction:column;min-width:0;flex:1}
.r1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r2{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.rr .num{font-weight:500}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:20px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-bad{background:var(--bad-soft);color:var(--bad)} .t-info{background:var(--info-soft);color:var(--info)} .t-gold{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold)}
.qa{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:500;color:var(--ink)}
.qa:hover{border-color:var(--ink-2)}
.chk{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--ink-3);display:grid;place-items:center;flex:none;background:none;color:transparent;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.done .r1{text-decoration:line-through;color:var(--ink-3)}
.empty{padding:26px 18px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px;color:var(--ink);font-weight:500}

/* toolbar */
.tb{display:flex;flex-direction:column;gap:10px}
.tbr{display:flex;gap:10px;align-items:center}
.srch{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:0 12px;min-width:0}
.srch input{border:0;background:none;outline:0;padding:11px 0;flex:1;min-width:0}
.srch .ic{color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;padding:10px 16px;font-weight:500;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.gold{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.dng{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chipb{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 13px;font-size:13px;font-weight:500;white-space:nowrap;color:var(--ink-2)}
.chipb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sum{font-size:13px;color:var(--ink-3);padding:0 2px}
.sum b{color:var(--ink);font-weight:500}

/* ficha */
.fh{display:flex;gap:14px;align-items:center}
.fh .av{width:56px;height:56px;font-size:18px}
.fh h1{font-family:var(--f-display);font-size:32px;font-weight:400;line-height:1.1}
.fh .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink);text-decoration:none}
.act .ic{color:var(--ink)}
.act:hover{border-color:var(--ink-2)}
.act.off{opacity:.4;pointer-events:none}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:500;font-size:14px;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
.tabs button i{font-style:normal;font-size:11px;color:var(--ink-3);margin-left:4px}
.kv{display:grid;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.kv{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}}
.kvi{padding:11px 0;border-top:1px solid var(--line);min-width:0}
.kvi span{display:block;font-size:12px;color:var(--ink-3)}
.kvi b{font-weight:500;overflow-wrap:anywhere}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.mini{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mini div{background:var(--surface-2);border-radius:11px;padding:10px 12px}
.mini span{display:block;font-size:12px;color:var(--ink-3)}
.mini b{font-size:18px;font-variant-numeric:tabular-nums}

/* agenda */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dw{font-size:10.5px;text-align:center;color:var(--ink-2);font-weight:500;padding-bottom:4px;text-transform:uppercase;letter-spacing:.2em}
.cd{aspect-ratio:1/1;max-width:100%;border:1px solid transparent;border-radius:10px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-variant-numeric:tabular-nums;font-weight:500;padding:0}
.cd.e{pointer-events:none}
.cd i{font-style:normal;font-size:9px;color:var(--ink-2);letter-spacing:1px;line-height:1}
.cd:hover{background:var(--surface-2)}
.cd.td{border-color:var(--gold)}
.cd.sel{background:var(--ink);color:#fff}
.cd.sel i{color:#fff}
.calh{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.calh h2{font-size:15px;font-weight:500;flex:1;text-transform:capitalize}
.kind{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--ink-2)}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart .g{stroke:var(--line)}
.chart .b{fill:var(--ink);opacity:.82}
.chart .b.cur{fill:var(--gold);opacity:1}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}
.chart text.v{fill:var(--ink-2);font-weight:500}
.bars{display:flex;flex-direction:column;gap:10px}
.bars .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bars .t{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--ink);border-radius:6px}
table.tt{width:100%;border-collapse:collapse;font-size:13.5px}
.tt th{text-align:left;font-size:11.5px;color:var(--ink-3);font-weight:500;padding:6px 0;border-bottom:1px solid var(--line)}
.tt td{padding:9px 0;border-bottom:1px solid var(--line)}
.tt td:last-child,.tt th:last-child{text-align:right}

/* catálogo */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1100px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.card:hover{border-color:var(--ink-2)}
.ph-img{aspect-ratio:4/3;max-width:100%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-3);font-size:22px;letter-spacing:.1em}
.ph-img img{width:100%;height:100%;object-fit:cover;display:block}
.card .cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .cb small{color:var(--ink-3);font-size:12px}
.card .cb b{font-weight:500;line-height:1.25}
.card .cb .num{font-weight:500;margin-top:4px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet .scrim{position:absolute;inset:0;background:rgba(29,29,31,.35)}
#sheet .panelx{position:relative;background:var(--bg);width:100%;max-width:720px;max-height:94%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:760px){#sheet{align-items:center}#sheet .panelx{border-radius:18px;max-height:90%}}
.sh{display:flex;align-items:center;gap:8px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.sh h2{font-family:var(--f-display);font-size:26px;font-weight:400;flex:1;min-width:0}
.sb{overflow:auto;padding:16px 18px;flex:1;min-height:0}
.sf{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.sf .grow{flex:1}
.fg{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:600px){.fg{grid-template-columns:repeat(2,minmax(0,1fr))}.fld.full{grid-column:1/-1}}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.fld>label i{color:var(--bad);font-style:normal}
.fld input:not([type=checkbox]),.fld select,.fld textarea,.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;outline:0}
.fld textarea{min-height:96px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{border-color:var(--ink-2)}
.ckc{display:flex;flex-wrap:wrap;gap:6px}
.ckc label{display:inline-flex}
.ckc input{position:absolute;opacity:0;pointer-events:none}
.ckc span{border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:13.5px;background:var(--surface);cursor:pointer}
.ckc input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
.ckc input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.tog{display:flex;align-items:center;gap:10px;font-weight:500;padding:10px 0}
.tog input{width:20px;height:20px;accent-color:var(--ink)}
.pick{position:relative}
.pkl{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden;max-height:300px;overflow-y:auto}
.pkl button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:9px 12px;text-align:left}
.pkl button:first-child{border-top:0}
.pkl button:hover{background:var(--surface-2)}
.pkl small{color:var(--ink-3);font-size:12px}
.pkl .new{color:var(--ink);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.lns{display:flex;flex-direction:column;gap:8px}
.ln{border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:8px}
.ln-n{border:0!important;padding:2px 0!important;min-height:0!important;font-weight:500;background:none!important}
.ln-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto auto;gap:6px;align-items:end}
@media (max-width:520px){.ln-g{grid-template-columns:repeat(4,minmax(0,1fr))}.ln-g .ln-t{grid-column:1/4;text-align:left!important}}
.ln-g label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--ink-3);font-weight:500;min-width:0}
.ln-g input,.ln-g select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 7px;min-width:0}
.ln-t{font-weight:500;text-align:right;padding-bottom:7px;white-space:nowrap}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 16px;margin-top:10px;font-size:14px;padding:12px 14px;background:var(--surface-2);border-radius:11px}
.tot span{color:var(--ink-2)} .tot b{text-align:right}
.tot .big{font-size:18px;color:var(--ink)}
.ai{background:var(--surface-2);border:0;border-top:1px solid var(--gold);border-radius:0 0 12px 12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ai .aih{display:flex;align-items:center;gap:8px;font-weight:500}
.ai .aih{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.ai .aih .ic{color:var(--ink-2)}
.ai .out{white-space:pre-wrap;font-size:14.5px;background:var(--surface);border-radius:10px;padding:12px;border:1px solid var(--line)}
.ai .out:empty{display:none}
.ai .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ai select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px}
.note{font-size:13px;color:var(--ink-3)}
.hist{margin-top:14px;border:1px solid var(--line);border-radius:11px;padding:12px;background:var(--surface-2)}.hist-h{font-weight:500;margin-bottom:8px}.hist-i{padding:8px 0;border-top:1px solid var(--line)}.hist-i:first-of-type{border-top:0}.hist-t{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.hist-t .btn{margin-left:auto}.hist ul{margin:6px 0 0;padding-left:18px;font-size:14px}.hist li .num{color:var(--ink-3)}
.err{color:var(--bad);font-size:13px}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px;min-height:240px}
.msg{max-width:88%;padding:11px 14px;border-radius:14px;white-space:pre-wrap;font-size:14.5px;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a.wait{color:var(--ink-3)}
.cin{display:flex;gap:8px;align-items:flex-end}
.cin textarea{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;max-height:160px;background:var(--surface);resize:none;outline:0}
.cin textarea:focus{border-color:var(--ink-2)}
.sugs{display:flex;gap:6px;flex-wrap:wrap}

.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mgrid button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-weight:500;text-align:left}
.mgrid button .ic{color:var(--ink)}
.banner{padding:12px 14px;border-radius:10px;background:var(--surface-2);color:var(--ink);font-size:14px}
.welcome{padding:22px;display:flex;flex-direction:column;gap:12px}
.welcome h2{font-family:var(--f-display);font-size:30px;font-weight:400}
.welcome ol{margin:0;padding-left:20px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:#fff;padding:10px 16px;border-radius:11px;font-weight:500;font-size:14px;max-width:calc(100% - 32px)}
.authmode #side,.authmode #tabbar,.authmode #fab,.authmode #top{display:none!important}
.authmode #app{display:block}
.authbox{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:16px}
.authbox .hat{width:46px}
.authh{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.15}
.skel{height:14px;border-radius:7px;background:var(--surface-2);margin:10px 16px}
@media (prefers-reduced-motion:no-preference){
  #sheet .panelx{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>

const snake=k=>k.replace(/[A-Z]/g,m=>'_'+m.toLowerCase());

const putLocal=(col,row)=>{if(row){const o=fromRow(row);S.data[col].set(o.id,o);schedule()}};
async function save(col,id,vals){
 if(!canAct())return null;
 const row=toRow(vals);
 const q=id?S.db.from(col).update(row).eq('id',id):S.db.from(col).insert(row);
 const{data,error}=await q.select().single();
 if(error){dbErr(error);return null}
 putLocal(col,data);return data.id}
async function patch(col,id,p){if(!canAct())return false;const{data,error}=await S.db.from(col).update(toRow(p)).eq('id',id).select().single();if(error){dbErr(error);return false}putLocal(col,data);return true}
async function remove(col,id){if(!canAct())return false;const{error}=await S.db.from(col).delete().eq('id',id);if(error){dbErr(error);return false}S.data[col].delete(id);schedule();return true}

 let h=`<div class="pg">${roBanner()}<div class="fh"><span class="av">${esc(initials(e.nome))}</span><div style="min-width:0;flex:1"><h1>${esc(e.nome)}</h1><div class="meta">${badge(ESTADOS[est],toneEst[est])}${(e.tipos||[]).map(k=>badge(TIPOS[k],'gold')).join('')}${e.localidade?badge(e.localidade):''}${est==='cliente'&&!e.codigoXd?badge('Por criar no XD','warn'):''}</div></div>${S.canWrite&&est==='cliente'&&!e.codigoXd?`<button class="btn sm" data-act="xdPed" data-id="${e.id}">Pedir criação no XD</button>`:''}${S.canWrite?`<button class="btn sm" data-act="edit" data-col="entidades" data-id="${e.id}">${ic('edit',16)}<span>Editar</span></button>`:''}</div>
 <div class="acts">

  <a class="act ${e.telemovel?'':'off'}" href="https://wa.me/${esc(waNum(e.telemovel))}" target="_blank" rel="noopener">${ic('wa')}<span>WhatsApp</span></a>
  <a class="act ${e.email?'':'off'}" href="mailto:${esc(e.email||'')}">${ic('mail')}<span>Email</span></a>
  <a class="act ${addr?'':'off'}" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}" target="_blank" rel="noopener">${ic('pin')}<span>Mapa</span></a></div>
 ${S.canWrite&&S.db?`<div class="tbr" style="flex-wrap:wrap;gap:8px">${est==='lead'?`<button class="btn sm" data-act="conv" data-id="${e.id}" data-c="potencial">Passar a potencial</button>`:''}${est==='lead'||est==='potencial'?`<button class="btn gold sm" data-act="conv" data-id="${e.id}" data-c="cliente">Converter em cliente</button>`:''}<button class="btn sm" data-act="new" data-col="visitas" data-preset='${esc(JSON.stringify({entidade:e.id}))}'>${ic('pin',16)}Nova visita</button><button class="btn sm" data-act="new" data-col="encomendas" data-preset='${esc(JSON.stringify({entidade:e.id}))}'>${ic('box',16)}Encomenda</button><button class="btn sm" data-act="new" data-col="pedidos" data-preset='${esc(JSON.stringify({entidade:e.id}))}'>${ic('tool',16)}Pedido</button></div>`:''}
 <div class="tabs">${tabs.map(([k,l,n])=>`<button class="${tab===k?'on':''}" data-act="ftab" data-c="${k}">${l}${n?`<i>${n}</i>`:''}</button>`).join('')}</div>`;
 const sub=(col,items,fn,emptyT,preset)=>`${S.canWrite&&S.db?`<div><button class="btn sm" data-act="new" data-col="${col}" data-preset='${esc(JSON.stringify(Object.assign({entidade:e.id},preset||{})))}'>${ic('plus',16)}${NOMES[col][1]}</button></div>`:''}${items.length?`<div class="panel">${items.map(fn).join('')}</div>`:`<div class="panel empty">${emptyT}</div>`}`;
 if(tab==='resumo'){
  const last=r.visitas[0];
  h+=`<div class="mini">${S.verValores?`<div><span>Vendas ${yr}</span><b>${eur(encAno)}</b></div>`:''}<div><span>Por receber</span><b style="color:${porRec?'var(--bad)':'inherit'}">${eur(porRec)}</b></div><div><span>Última visita</span><b>${last?fD(last.data):'—'}</b></div><div><span>Próximo contacto</span><b>${e.proximoContacto?fD(e.proximoContacto):'—'}</b></div></div>
  ${aiBox('ficha',e)}
  <div class="panel"><div class="pb" style="padding-top:4px"><div class="kv">${[['Pessoa de contacto',e.contacto],['Telemóvel',e.telemovel],['Telefone',e.telefone],['Email',e.email],['NIF',e.nif],['Morada',addr],['Zona',e.zona],['Equipamento instalado',e.equipamento],['Origem',e.origem],['Responsável',e.resp?nameOf(e.resp):''],['Código no XD',e.codigoXd],['Cliente desde',e.criado?fDY(e.criado):'']].filter(x=>x[1]).map(([l,v])=>`<div class="kvi"><span>${l}</span><b>${esc(v)}</b></div>`).join('')}</div>${e.notas?`<div class="kvi"><span>Notas</span><b style="font-weight:400;white-space:pre-wrap">${esc(e.notas)}</b></div>`:''}</div></div>`;
 }
 if(tab==='visitas')h+=sub('visitas',r.visitas,visRow,'<b>Sem visitas</b>Registe a primeira visita a este cliente.');
 if(tab==='encomendas')h+=sub('encomendas',r.encomendas,encRow,'<b>Sem encomendas</b>');
 if(tab==='propostas')h+=sub('propostas',r.propostas,propRow,'<b>Sem propostas</b>');
 if(tab==='pedidos')h+=sub('pedidos',r.pedidos,pedRow,'<b>Sem pedidos</b>Abertura, instalação, manutenção ou assistência.');
 if(tab==='avencas')h+=sub('avencas',r.avencas,avRow,'<b>Sem avenças</b>');
 if(tab==='conta'){const rc=r.pagamentos.filter(p=>p.estado==='fechado'||p.estado==='recibo').reduce((s,p)=>s+(+p.valor||0),0);
  h+=`<div class="mini"><div><span>Por receber</span><b>${eur(porRec)}</b></div>${S.verValores?`<div><span>Recebido</span><b>${eur(rc)}</b></div><div><span>Encomendas ${yr}</span><b>${eur(encAno)}</b></div>`:''}<div><span>Avenças ativas</span><b>${r.avencas.filter(a=>a.ativa!==false).length}</b></div></div>`+xdContaH(e.id)+(S.verValores?sub('pagamentos',r.pagamentos,pagRow,'<b>Sem movimentos</b>Registe pagamentos por receber e recebimentos.',{estado:'receber'}):'');}
 if(tab==='tarefas')h+=sub('tarefas',r.tarefas,tarRow,'<b>Sem tarefas</b>');
 return h+'</div>'});

const encRow=x=>rowH({col:'encomendas',id:x.id,title:entName(x.entidade),sub:[fD(x.data),(x.linhas||[]).length+' artigo'+((x.linhas||[]).length===1?'':'s'),x.entregarPor?'Entrega: '+nameOf(x.entregarPor):''].filter(Boolean).join(' · '),right:eur(docTotal(x)),badges:badge(x.estado||'Nova',toneEnc[x.estado]||'mute')});
const propRow=x=>rowH({col:'propostas',id:x.id,title:entName(x.entidade),sub:[fD(x.data),x.validade?'válida até '+fD(x.validade):''].filter(Boolean).join(' · '),right:eur(docTotal(x)),badges:badge(x.estado||'Rascunho',toneProp[x.estado]||'mute')});
const pedRow=x=>rowH({col:'pedidos',id:x.id,title:(x.tipo||'Pedido')+' · '+entName(x.entidade),sub:[x.agendado?'Agendado '+fD(x.agendado):fD(x.data),x.descricao].filter(Boolean).join(' — '),badges:badge(x.estado||'Aberto',tonePed[x.estado]||'mute')+(S.canWrite&&x.estado!=='Concluído'?`<button class="qa" data-act="pedNext" data-id="${x.id}">${EST_PED[EST_PED.indexOf(x.estado||'Aberto')+1]||'Concluído'}</button>`:'')});
const avRow=x=>{const[s,t]=avencaStatus(x);return rowH({col:'avencas',id:x.id,title:entName(x.entidade),sub:[x.descricao,PERIOD[x.periodicidade],x.xdId&&x.ultimaCobranca?'faturada a '+fD(x.ultimaCobranca):''].filter(Boolean).join(' · '),right:eur(x.valor),badges:badge(s,t)+(x.xdEstado==='por_criar'?badge('Por criar no XD','warn'):'')+(x.xdId?badge('XD','mute'):'')+(S.canWrite&&x.ativa!==false&&!x.xdId?`<button class="qa" data-act="cobrar" data-id="${x.id}">Cobrar</button>`:'')})};
const pagRow=x=>rowH({col:'pagamentos',id:x.id,title:entName(x.entidade),sub:[fD(x.data),x.metodo,x.referente].filter(Boolean).join(' · '),right:eur(x.valor),badges:badge(EST_PAG[x.estado]||'—',tonePag[x.estado]||'mute')+(S.canWrite&&x.estado==='receber'?`<button class="qa" data-act="pagSt" data-id="${x.id}" data-c="recibo">Recebido</button>`:'')+(S.canWrite&&x.estado==='recibo'?`<button class="qa" data-act="pagSt" data-id="${x.id}" data-c="fechado">Recibo emitido</button>`:'')});
const tarRow=x=>rowH({col:'tarefas',id:x.id,title:x.titulo,cls:x.feito?'done':'',extra:`<button class="chk ${x.feito?'on':''}" data-act="tgl" data-id="${x.id}" aria-label="Concluir">${ic('check',14)}</button>`,sub:[x.data?fD(x.data)+(x.hora?' '+x.hora:''):'Sem data',x.entidade?entName(x.entidade):'',nameOf(x.resp)].filter(Boolean).join(' · '),badges:x.prioridade==='alta'?badge('Alta','bad'):(x.data&&!x.feito&&x.data<TODAY()?badge('Atrasada','warn'):'')});
const compRow=x=>rowH({col:'compras',id:x.id,title:x.fornecedor,sub:[fD(x.data),x.documento,x.descricao].filter(Boolean).join(' · '),right:eur(x.valor),badges:x.pago?badge('Pago','ok'):badge('Por pagar','warn')});

function genList(view,col,chips,filterFn,sortFn,rowFn,keys,emptyT,sumFn,newLabel,preset){
 const chip=S.f[view]??chips[0];
 let items=D(col).filter(d=>filterFn(d,chip)&&match(view,d,keys)).sort(sortFn);
 return `<div class="pg">${roBanner()}${toolbarH(view,chips,col,newLabel,preset)}${sumFn?`<div class="sum">${sumFn(items)}</div>`:''}${listBlock(view,items,rowFn,emptyT)}</div>`}
const byDateDesc=(a,b)=>(b.data||'').localeCompare(a.data||'');
VIEWS.visitas=()=>loadingOr(()=>genList('visitas','visitas',['Todas','As minhas',...RESUMOS],(d,c)=>c==='Todas'||(c==='As minhas'?isMine(d):d.resumo===c),byDateDesc,visRow,['entidade','relatorio','acao','resumo','tipo'],'<b>Sem visitas</b>Registe as visitas com o relatório e o próximo passo.',i=>`<b>${i.length}</b> visita${i.length===1?'':'s'}`,'Nova visita'));
VIEWS.encomendas=()=>loadingOr(()=>genList('encomendas','encomendas',['Ativas','Para eu entregar','Todas',...EST_ENC],(d,c)=>c==='Todas'||(c==='Para eu entregar'?d.entregarPor===S.uid&&!['Entregue','Faturada','Cancelada'].includes(d.estado):c==='Ativas'?!['Faturada','Cancelada'].includes(d.estado):d.estado===c),byDateDesc,encRow,['entidade','obs','estado'],'<b>Sem encomendas</b>',i=>`<b>${i.length}</b> encomenda${i.length===1?'':'s'} · <b>${eur(i.filter(x=>x.estado!=='Cancelada').reduce((s,x)=>s+docTotal(x),0))}</b>`,'Nova encomenda'));
VIEWS.propostas=()=>loadingOr(()=>genList('propostas','propostas',['Em aberto','Todas',...EST_PROP],(d,c)=>c==='Todas'||(c==='Em aberto'?['Rascunho','Enviada'].includes(d.estado||'Rascunho'):d.estado===c),byDateDesc,propRow,['entidade','obs','estado'],'<b>Sem propostas</b>Crie propostas com os artigos do catálogo e registe o envio.',i=>`<b>${i.length}</b> proposta${i.length===1?'':'s'} · <b>${eur(i.reduce((s,x)=>s+docTotal(x),0))}</b>`,'Nova proposta'));
VIEWS.avencas=()=>loadingOr(()=>genList('avencas','avencas',['A vencer','Ativas','Inativas'],(d,c)=>c==='Inativas'?d.ativa===false:d.ativa!==false&&(c==='Ativas'||(d.proxima&&diffDays(d.proxima,TODAY())<=15)),(a,b)=>(a.proxima||'9').localeCompare(b.proxima||'9'),avRow,['entidade','descricao'],'<b>Nada a vencer nos próximos 15 dias</b>Veja todas em "Ativas".',i=>{const m=i.filter(a=>a.ativa!==false).reduce((s,a)=>s+(+a.valor||0)/(+a.periodicidade||1),0);return `<b>${i.length}</b> avença${i.length===1?'':'s'} · equivalente a <b>${eur(m)}</b>/mês. "Cobrar" cria o recebimento e passa para a próxima data.`},'Nova avença'));
VIEWS.pedidos=()=>loadingOr(()=>genList('pedidos','pedidos',['Por tratar','Todos',...TIPOS_PED,'Concluídos'],(d,c)=>c==='Todos'||(c==='Por tratar'?d.estado!=='Concluído':c==='Concluídos'?d.estado==='Concluído':d.tipo===c&&d.estado!=='Concluído'),(a,b)=>(EST_PED.indexOf(a.estado)-EST_PED.indexOf(b.estado))||(a.agendado||a.data||'').localeCompare(b.agendado||b.data||''),pedRow,['entidade','descricao','tipo','equipamento'],'<b>Sem pedidos por tratar</b>Pedidos de abertura de cliente, instalação, manutenção e assistência.',i=>`<b>${i.length}</b> pedido${i.length===1?'':'s'}`,'Novo pedido'));
VIEWS.pagamentos=()=>loadingOr(()=>genList('pagamentos','pagamentos',['Por receber','Recibo por emitir','Recibo emitido','Todos'],(d,c)=>c==='Todos'||EST_PAG[d.estado]===c,byDateDesc,pagRow,['entidade','referente','metodo'],'<b>Nada aqui</b>Quando receber dinheiro, registe-o para não se esquecer de tirar o recibo.',i=>`<b>${i.length}</b> movimento${i.length===1?'':'s'} · <b>${eur(i.reduce((s,x)=>s+(+x.valor||0),0))}</b>`,'Registar',{estado:S.f.pagamentos==='Por receber'||!S.f.pagamentos?'receber':'recibo'}));
VIEWS.compras=()=>loadingOr(()=>genList('compras','compras',['Todas','Por pagar','Este mês'],(d,c)=>c==='Todas'||(c==='Por pagar'?!d.pago:(d.data||'').startsWith(TODAY().slice(0,7))),byDateDesc,compRow,['fornecedor','descricao','documento'],'<b>Sem compras</b>Registe as compras a fornecedores.',i=>`<b>${i.length}</b> compra${i.length===1?'':'s'} · <b>${eur(i.reduce((s,x)=>s+(+x.valor||0),0))}</b>`,'Nova compra'));
VIEWS.catalogo=()=>loadingOr(()=>{
 const chips=['Todos',...FAMILIAS.filter(f=>D('artigos').some(a=>a.familia===f)),'Inativos'];const chip=S.f.catalogo??'Todos';
 const items=D('artigos').filter(a=>(chip==='Inativos'?a.ativo===false:a.ativo!==false&&(chip==='Todos'||a.familia===chip))&&match('catalogo',a,['nome','ref','familia','descricao'])).sort((a,b)=>(a.familia||'').localeCompare(b.familia||'')||(a.nome||'').localeCompare(b.nome||''));
 return `<div class="pg">${roBanner()}${toolbarH('catalogo',chips,'artigos','Novo artigo')}<div class="sum"><b>${items.length}</b> artigo${items.length===1?'':'s'}</div>${items.length?`<div class="cards">${items.map(a=>`<button class="card" data-act="art" data-id="${a.id}"><div class="ph-img">${a.foto?`<img src="${esc(fotoUrl(a.foto))}" alt="" loading="lazy">`:esc(initials(a.nome))}</div><div class="cb"><small>${esc([a.ref,a.familia].filter(Boolean).join(' · '))}</small><b>${esc(a.nome)}</b><span class="num">${a.preco!=null&&a.preco!==''?eur(a.preco)+' <small>+ IVA</small>':'<small>Sem preço</small>'}</span></div></button>`).join('')}</div>`:'<div class="panel empty"><b>Catálogo vazio</b>Adicione os artigos para os usar em encomendas e propostas.</div>'}</div>`});

 ${S.me?`<div class="panel" style="padding:14px 16px;display:flex;gap:12px;align-items:center"><div class="me"><img src="${esc(S.me.avatarUrl)}" alt=""></div><div><b>${esc(S.me.name||'Utilizador')}</b><div class="note">${S.canWrite?'Pode criar e editar registos':'Acesso só de leitura'}</div></div></div>`:''}

VIEWS.assistente=()=>{
 if(!S.sample)return `<div class="panel empty"><b>O Claude está em pausa.</b>Está tudo preparado. Quando quiser ligar o assistente, o relatório inteligente e as mensagens, basta ativar a chave da API.</div>`;
 const sugs=['O que tenho para hoje?','Que avenças vencem esta semana?','Que clientes de comodato não visito há mais de 60 dias?','Quanto tenho por receber e de quem?','Lembra-me de ligar amanhã a um cliente'];
 return `<div class="pg"><div class="panel"><div class="pb" style="padding-top:16px"><div class="chat" id="chatlog">
  ${S.chat.length?'':`<div class="msg a">Olá${S.me?.name?' '+esc(S.me.name.split(' ')[0]):''}. Consigo consultar clientes, encomendas, avenças, pedidos, recebimentos e a agenda, e criar tarefas. Em que posso ajudar?</div>`}
  ${S.chat.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${esc(m.content)}</div>`).join('')}
  ${S.chatBusy?`<div class="msg a ${S.chatStream?'':'wait'}" id="chatstream">${esc(S.chatStream||'A pensar…')}</div>`:''}</div></div></div>
  ${S.chat.length?'':`<div class="sugs">${sugs.map(s=>`<button class="chipb" data-act="sug" data-c="${esc(s)}">${esc(s)}</button>`).join('')}</div>`}
  <div class="cin"><textarea id="chatin" rows="1" placeholder="Faça uma pergunta ao Claude sobre os seus clientes…" aria-label="Mensagem para o assistente"></textarea>${S.chatBusy?`<button class="btn" data-act="chatstop">Parar</button>`:`<button class="btn gold" data-act="chatsend" aria-label="Enviar">${ic('send',18)}</button>`}</div>
  ${S.chat.length?`<div><button class="btn sm" data-act="chatclr">Nova conversa</button></div>`:''}</div>`};

/* ================= formulários ================= */
function defVal(f){const d=f.def;if(d==='@me')return S.uid||'';if(d==='@now')return NOWDT();if(d==='@today')return TODAY();if(d==='@d30')return addDays(TODAY(),30);return d}
function teamIds(){const s=new Set([...S.data.equipa.keys()].filter(k=>!k.startsWith('email:')));if(S.uid)s.add(S.uid);return[...s]}
function fieldH(f,v){
 const id='f-'+f.k,lab=`<label for="${f.t==='ent'?id+'-q':id}">${esc(f.l)}${f.req?' <i>*</i>':''}</label>`;let i='';
 switch(f.t){
  case'text':case'tel':case'email':i=`<input id="${id}" type="${f.t}" value="${esc(v??'')}" placeholder="${esc(f.ph||'')}" ${f.t==='tel'?'inputmode="tel"':''} autocomplete="off">`;break;
  case'num':i=`<input id="${id}" type="number" step="0.01" inputmode="decimal" value="${v??''}">`;break;
  case'date':i=`<input id="${id}" type="date" value="${esc(v||'')}">`;break;
  case'time':i=`<input id="${id}" type="time" value="${esc(v||'')}">`;break;
  case'dt':i=`<input id="${id}" type="datetime-local" value="${esc(v||'')}">`;break;
  case'sel':i=`<select id="${id}">${f.req?'':'<option value="">—</option>'}${opts(f.o).map(([k,l])=>`<option value="${esc(k)}" ${String(v??'')===String(k)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;break;
  case'multi':{const a=v||[];i=`<div class="ckc" id="${id}">${opts(f.o).map(([k,l])=>`<label><input type="checkbox" value="${esc(k)}" ${a.includes(k)?'checked':''}><span>${esc(l)}</span></label>`).join('')}</div>`;break}
  case'area':i=`<textarea id="${id}" placeholder="${esc(f.ph||'')}">${esc(v||'')}</textarea>`;break;
  case'bool':return `<div class="fld${f.full?' full':''}"><label class="tog"><input id="${id}" type="checkbox" ${v?'checked':''}><span>${esc(f.l)}</span></label></div>`;
  case'user':{const ids=teamIds();i=`<select id="${id}"><option value="">—</option>${ids.map(u=>`<option value="${esc(u)}" ${v===u?'selected':''}>${esc(nameOf(u))}${u===S.uid?' (eu)':''}</option>`).join('')}</select>`;break}
  case'ent':i=`<div class="pick"><input id="${id}-q" class="inp" data-pick="${f.k}" value="${esc(v?entName(v):'')}" placeholder="Procurar cliente pelo nome" autocomplete="off"><input type="hidden" id="${id}" value="${esc(v||'')}"><div class="pkl" id="pk-${f.k}" hidden></div></div>`;break;
  case'linhas':i=`<div id="linhas">${linhasH()}</div>${['encomendas','propostas'].includes(S.form?.col)?`<div id="enc-hist">${histH()}</div>`:''}`;break;
  case'foto':i=`<div style="display:flex;gap:12px;align-items:center"><div class="ph-img" style="width:96px;border-radius:10px;overflow:hidden" id="fotoprev">${v?`<img src="${esc(fotoUrl(v))}" alt="">`:'—'}</div><input type="hidden" id="${id}" value="${esc(v||'')}">${S.assets?`<label class="btn sm">Escolher fotografia<input type="file" accept="image/png,image/jpeg,image/webp" data-foto="1" hidden></label>`:'<span class="note">Só quem pode editar o CRM consegue carregar fotografias.</span>'}</div>`;break;
 }
 return `<div class="fld${f.full?' full':''}" data-k="${f.k}">${lab}${i}</div>`}

async function copyText(t,b){try{await navigator.clipboard.writeText(t);toast('Copiado')}catch(_){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copiado')}catch(__){toast('Selecione o texto e copie manualmente')}ta.remove()}}

document.addEventListener('click',e=>{

 if(!e.target.closest('.pick'))document.querySelectorAll('.pkl').forEach(p=>p.hidden=true);

 if(b.tagName==='A'){if(a==='mailgo')setTimeout(closeSheet,400);if(a==='xdgo'){const now=new Date().toISOString();if(b.dataset.av)patch('avencas',b.dataset.av,{pedidoXd:now});else if(b.dataset.ent)patch('entidades',b.dataset.ent,{pedidoXd:now});setTimeout(closeSheet,400)}return}e.preventDefault();e.stopPropagation();ACT[a](b.dataset,b,e)});

async function loadTable(col){let all=[],from=0;for(;;){const{data,error}=await S.db.from(col).select('*').range(from,from+999);if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000}const m=new Map();all.forEach(r=>{const o=fromRow(r);m.set(o.id,o)});S.data[col]=m;S.ready[col]=true;schedule()}
async function loadTeam(){const{data}=await S.db.from('membros').select('*').order('nome');const m=new Map();(data||[]).forEach(r=>{const id=r.user_id||('email:'+r.email);m.set(id,{id,nome:r.nome,email:r.email,papel:r.papel,total:!!r.acesso_total,desde:r.desde,ligado:!!r.user_id})});S.data.equipa=m;schedule()}
async function uploadFoto(file){const ext=((file.name||'').split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;const{error}=await S.db.storage.from('artigos').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});if(error)throw{code:/size|large/i.test(error.message)?'too_large':'upstream_error'};return{id:path,url:fotoUrl(path)}}

function parseJ(t){t=String(t||'').trim();try{return JSON.parse(t)}catch(_){}const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(_){}}const i=Math.min(...['{','['].map(c=>{const k=t.indexOf(c);return k<0?1e9:k})),j=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));if(i<1e9&&j>i)return JSON.parse(t.slice(i,j+1));throw new Error('no json')}

function encMail(x){const e=ent(x.entidade)||{};const em=String(e.email||'').split(/[;,\s]+/).find(v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))||'';
 const t=totais(x.linhas),nome=e.nome||'Cliente',num=e.codigoXd?` · Cliente n.º ${e.codigoXd}`:'',cab=`Cliente: ${nome}${e.codigoXd?` (n.º ${e.codigoXd})`:''}`;

 const resumo=`${linhas||'(sem artigos)'}\n\nTotal sem IVA: ${eur(t.base)}\nIVA: ${eur(t.iva)}\nTotal: ${eur(t.total)}${x.entrega?`\n\nEntrega prevista: ${fDY(x.entrega)}`:''}`;
 const obs=x.obs?`\n\nObservações: ${x.obs}`:'';

 if(em){to=em;cc=GERAL;subject=`Confirmação de encomenda · ${nome}${num} · ${fDY(x.data)}`;body=`Olá${e.contacto?' '+e.contacto:''},\n\nConfirmamos a sua encomenda de ${fDY(x.data)}.\n\n${cab}\n\n${resumo}\n\nQualquer dúvida, estamos ao dispor.${ass}`}
 else{to=GERAL;subject=`Encomenda · ${nome}${num} · ${fDY(x.data)} · ${eur(t.total)}`;body=`Nova encomenda (cliente sem email na ficha).\n\n${cab}${e.telemovel||e.telefone?`\nContacto: ${e.telemovel||e.telefone}`:''}\n\n${resumo}${obs}${ass}`}
 const q=[cc&&'cc='+encodeURIComponent(cc),'subject='+encodeURIComponent(subject),'body='+encodeURIComponent(body)].filter(Boolean).join('&');
 return{href:`mailto:${to}?${q}`,to,cliente:!!em}}

async function enviarEncEmail(id){
 const{data:{session}}=await S.db.auth.getSession();
 try{const r=await fetch(CFG.url+'/functions/v1/encomenda-email',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(session?.access_token||''),apikey:CFG.anonKey},body:JSON.stringify({id})});
  const j=await r.json().catch(()=>({}));

  return{ok:false,msg:j.code==='email_desligado'?'Envio por email ainda não está ligado':'Não foi possível enviar o email da encomenda'}}

async function callClaude(body,signal){
 const{data:{session}}=await S.db.auth.getSession();
 let r;try{r=await fetch(CFG.url+'/functions/v1/claude',{method:'POST',signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(session?.access_token||''),apikey:CFG.anonKey},body:JSON.stringify(body)})}
 catch(e){throw{code:e?.name==='AbortError'?'cancelled':'upstream_error',message:String(e)}}
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw{code:j.code||(r.status===429?'rate_limited':r.status===401?'session_expired':r.status===403?'not_granted':'upstream_error'),message:j.error||('HTTP '+r.status)};
 return j}
function makeSample(){
 async function run(input,opts={}){
  let msgs=typeof input==='string'?[{role:'user',content:input}]:input.map(m=>({role:m.role,content:m.content}));
  const merged=[];for(const m of msgs){const l=merged[merged.length-1];if(l&&l.role===m.role&&typeof l.content==='string'&&typeof m.content==='string')l.content+='\n\n'+m.content;else merged.push({...m})}
  msgs=merged;const tools=opts.tools;const model=opts.modelTier==='quick'?'rapido':'normal';let acc='';
  for(let round=0;round<6;round++){
   const res=await callClaude({model,messages:msgs,max_tokens:2000,tools:tools?.map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema||{type:'object',properties:{}}}))},opts.signal);
   const txt=(res.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
   if(txt){const delta=(acc?'\n\n':'')+txt;acc+=delta;try{opts.onText?.({text:acc,delta})}catch(_){}}
   const uses=(res.content||[]).filter(c=>c.type==='tool_use');
   if(res.stop_reason!=='tool_use'||!uses.length||!tools)break;
   msgs.push({role:'assistant',content:res.content});
   const out=[];for(const u of uses){const t=tools.find(x=>x.name===u.name);let v,err=false;try{if(!t)throw new Error('Ferramenta desconhecida');v=await t.execute(u.input||{},{signal:opts.signal})}catch(e){v='Error: '+(e?.message||e);err=true}out.push({type:'tool_result',tool_use_id:u.id,content:(typeof v==='string'?v:JSON.stringify(v)).slice(0,30000),is_error:err})}
   msgs.push({role:'user',content:out});
  }
  if(!acc)throw{code:'empty_completion'};return{text:acc,truncated:false}}
 const f=(i,o)=>run(i,o);
 f.json=async(i,o)=>{const{text}=await run(i,o);try{return parseJ(text)}catch(_){throw{code:'invalid_json',text}}};
 f.limits=async()=>({tools:{maxCount:10}});
 return f}

let started=false;
async function boot(){
 render();
 if(!CFG.url||!CFG.anonKey||!window.supabase){S.offline=true;S.offMsg='Falta configurar o ficheiro config.js com o endereço e a chave do Supabase.';render();return}
 S.db=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 S.db.auth.onAuthStateChange((ev,session)=>{if(ev==='SIGNED_IN'&&session)setTimeout(()=>start(session),0)});
 const{data:{session}}=await S.db.auth.getSession();
 if(!session){S.view='login';render();return}
 start(session);
}
async function start(session){
 if(started||!session)return;started=true;
 const{data:m,error}=await S.db.rpc('ligar_membro');
 if(error||!m||!m.email){started=false;S.view='semacesso';S.loginEmail=session.user.email;render();return}
 S.uid=session.user.id;S.canWrite=m.papel!=='leitura';S.isAdmin=m.papel==='admin';S.verValores=m.papel==='admin'||!!m.acesso_total;
 S.me={name:m.nome||session.user.email,email:m.email,avatarUrl:avatarFor(m.nome||session.user.email)};
 S.view='inicio';S.hist=[];render();
 await loadTeam();
 await Promise.all(COLS.map(c=>loadTable(c).catch(e=>{console.warn(c,e);S.ready[c]=true})));
 loadTable('xd_documentos').catch(e=>console.warn('xd',e));
 S.db.channel('crm').on('postgres_changes',{event:'*',schema:'public'},p=>{const col=p.table;if(col==='membros'){loadTeam();return}if(!S.data[col])return;if(p.eventType==='DELETE'){if(p.old?.id)S.data[col].delete(p.old.id)}else{const o=fromRow(p.new);S.data[col].set(o.id,o)}schedule()}).subscribe();
 S.sample=CFG.claude===false?null:makeSample();S.assets=S.canWrite?{upload:uploadFoto}:null;schedule();
}
if(window.MAQ_INIT)MAQ_INIT();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
