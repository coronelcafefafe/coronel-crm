<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pedido de água · Coronel Café</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
:root{--ink:#1D1D1F;--ink2:#6E6E73;--line:#E5E5EA;--box:#F2F2F4;--gold:#C4A052}
*{box-sizing:border-box}
html,body{margin:0;background:#FFFFFF;color:var(--ink);font-family:'Hanken Grotesk',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:480px;margin:0 auto;padding:28px 16px 40px}
.marca{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.16em;color:var(--ink2)}
.marca img{width:28px;height:28px;border-radius:6px}
.rule{height:1px;width:44px;background:var(--gold);margin:16px 0 18px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:34px;line-height:1.08;margin:0 0 10px}
p{font-size:15px;line-height:1.5;margin:0 0 12px}
.sub{color:var(--ink2)}
.card{border:1px solid var(--line);border-radius:14px;padding:4px 16px;margin:20px 0 14px}
.prod{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.prod+.prod{border-top:1px solid var(--line)}
.loja{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:22px;margin:22px 0 -12px}
.prod b{display:block;font-weight:500;font-size:15px}
.prod small{color:var(--ink2);font-size:13px}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--box);color:var(--ink);font-size:22px;line-height:1;cursor:pointer;font-family:inherit}
.step button:active{background:var(--line)}
.step input{width:62px;height:44px;text-align:center;font-size:18px;font-weight:500;border:1px solid var(--line);border-radius:12px;font-family:inherit;color:var(--ink);background:#fff;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
label.nota{display:block;font-size:13px;color:var(--ink2);margin:6px 0 6px}
textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;color:var(--ink);resize:vertical}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:12px;font:inherit;font-size:16px;font-weight:500;cursor:pointer;margin-top:10px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.estado{background:var(--box);border-radius:12px;padding:12px 14px;font-size:14px;margin:16px 0 0}
.erro{color:#B3261E;font-size:14px;margin:10px 0 0;min-height:1em}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2);line-height:1.6}
footer a{color:var(--ink2)}
.oculto{display:none}
</style>
</head>
<body>
<main>
  <div class="marca"><img src="icon-192.png" alt="">CORONEL CAFÉ</div>
  <div class="rule"></div>
  <div id="app"><p class="sub">A carregar…</p></div>
  <footer>Coronel Café · LPAM Unipessoal Lda<br><a href="tel:+351919982150">919 982 150</a> · <a href="mailto:geral@coronelcafe.com">geral@coronelcafe.com</a></footer>
</main>
<script src="config.js"></script>
<script>
(function () {
  const C = window.CRM_CONFIG, FN = C.url + '/functions/v1/pedido-cliente', H = { apikey: C.anonKey, 'Content-Type': 'application/json' };
  const t = new URLSearchParams(location.search).get('t') || '';
  const app = document.getElementById('app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let D = null;

  function msg(titulo, texto) { app.innerHTML = `<h1>${esc(titulo)}</h1><p class="sub">${texto}</p>`; }

  function desenhar() {
    const lojas = D.locais && D.locais.length ? D.locais : [''];
    const q = (a, k) => (D.linhas.find(l => l.artigo === a && (l.local || '') === k) || {}).qt || 0;
    const chave = (a, k) => esc(a + '|' + k);
    const resp = D.resposta === 'sim' ? `<div class="estado">Já recebemos o seu pedido. Pode alterá-lo até ${esc(D.limite)}.</div>`
      : D.resposta === 'nao' ? `<div class="estado">Indicou que não precisa desta vez. Se mudar de ideias, faça o pedido aqui até ${esc(D.limite)}.</div>` : '';
    if (!D.aberto) {
      app.innerHTML = `<h1>Pedido fechado</h1><p class="sub">Os pedidos para a entrega de ${esc(D.dia)} fecharam ${esc(D.limite)}.</p>${resp}<p class="sub" style="margin-top:14px">Se ainda precisar, ligue-nos para o 919 982 150.</p>`;
      return;
    }
    app.innerHTML = `<h1>Precisa de água?</h1>
      <p>${esc(D.cliente)}</p>
      <p class="sub">Entrega na <b style="color:#1D1D1F;font-weight:500">${esc(D.dia)}</b>. Pode fazer ou alterar o pedido até ${esc(D.limite)}.</p>
      ${resp}
      ${lojas.map(k => `${k ? `<h2 class="loja">Loja de ${esc(k)}</h2>` : ''}<div class="card">${D.produtos.map(p => `<div class="prod"><div><b>${esc(p.nome)}</b><small>${p.passo > 1 ? 'Em múltiplos de ' + p.passo : esc(p.un)}</small></div>
        <div class="step"><button type="button" data-a="${chave(p.artigo, k)}" data-d="-1" aria-label="Menos">−</button>
        <input inputmode="numeric" pattern="[0-9]*" data-q="${chave(p.artigo, k)}" value="${q(p.artigo, k)}" aria-label="Quantidade de ${esc(p.nome)}${k ? ' para ' + esc(k) : ''}">
        <button type="button" data-a="${chave(p.artigo, k)}" data-d="1" aria-label="Mais">+</button></div></div>`).join('')}</div>`).join('')}
      <label class="nota" for="obs">Alguma nota para a entrega? (opcional)</label>
      <textarea id="obs" maxlength="500" placeholder="Ex.: deixar na receção">${esc(D.obs || '')}</textarea>
      <div class="erro" id="erro"></div>
      <button class="btn pri" id="ok">${D.resposta === 'sim' ? 'Atualizar pedido' : 'Confirmar pedido'}</button>
      <button class="btn" id="nao">Não preciso desta vez</button>`;
    app.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
      const p = D.produtos.find(x => x.artigo === b.dataset.a.split('|')[0]), i = app.querySelector(`[data-q="${CSS.escape(b.dataset.a)}"]`);
      const v = Math.max(0, Math.min(p.max, (parseInt(i.value, 10) || 0) + (+b.dataset.d) * p.passo));
      i.value = v;
    });
    document.getElementById('ok').onclick = () => enviar(false);
    document.getElementById('nao').onclick = () => enviar(true);
  }

  async function enviar(nada) {
    const linhas = [...app.querySelectorAll('[data-q]')].map(i => { const [artigo, local] = i.dataset.q.split('|'); return { artigo, local: local || undefined, qt: Math.max(0, parseInt(i.value, 10) || 0) }; });
    const erro = document.getElementById('erro');
    if (!nada && !linhas.some(l => l.qt > 0)) { erro.textContent = 'Indique pelo menos uma quantidade.'; return; }
    app.querySelectorAll('button').forEach(b => b.disabled = true);
    try {
      const r = await fetch(FN, { method: 'POST', headers: H, body: JSON.stringify({ t, nada, linhas, obs: document.getElementById('obs').value }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok) {
        if (nada) msg('Obrigado', `Fica registado que não precisa de água para ${esc(D.dia)}. Até à próxima.`);
        else {
          const txt = linhas.filter(l => l.qt > 0).map(l => `${l.local ? esc(l.local) + ': ' : ''}${l.qt} × ${esc(D.produtos.find(p => p.artigo === l.artigo).nome)}`).join('<br>');
          msg('Pedido recebido', `Entregamos na ${esc(D.dia)}:<br><b style="color:#1D1D1F;font-weight:500">${txt}</b><br><br>Pode alterar o pedido neste mesmo link até ${esc(D.limite)}.`);
        }
        if (D.demo) app.insertAdjacentHTML('beforeend', '<div class="estado">Isto é um exemplo: nada foi gravado.</div>');
        return;
      }
      erro.textContent = j.error === 'fechado' ? 'Os pedidos para esta entrega já fecharam. Ligue-nos para o 919 982 150.'
        : j.error === 'ja_preparada' ? 'O seu pedido já está a ser preparado. Para alterar, ligue-nos para o 919 982 150.'
        : 'Não foi possível enviar. Tente outra vez.';
    } catch (_) { erro.textContent = 'Sem ligação à internet. Tente outra vez.'; }
    app.querySelectorAll('button').forEach(b => b.disabled = false);
  }

  if (!t) return msg('Link incompleto', 'Abra o link diretamente a partir do email que recebeu.');
  fetch(FN + '?t=' + encodeURIComponent(t), { headers: { apikey: C.anonKey } })
    .then(r => r.json().then(j => ({ ok: r.ok, j })))
    .then(({ ok, j }) => { if (!ok) return msg('Link inválido', 'Este link não é válido ou já expirou. Se precisar de água, ligue-nos para o 919 982 150.'); D = j; desenhar(); })
    .catch(() => msg('Sem ligação', 'Não foi possível carregar o pedido. Verifique a ligação e tente outra vez.'));
})();
</script>
</body>
</html>
